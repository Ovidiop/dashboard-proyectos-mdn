[build]
  command = "npm test && npm run build"
  publish = "dist"

[functions]
  directory = "netlify/functions"

# Congela el score de desempeño del mes anterior el día 5 a las 08:00 Caracas (12:00
# UTC), después del cron SQL de cierre de metric_reports (07:30 Caracas) — ver
# netlify/functions/employee-scores-snapshot.js y ARQUITECTURA.md §2.7.
[functions."employee-scores-snapshot"]
  schedule = "0 12 5 * *"

[[redirects]]
  from = "/api/projects"
  to = "/.netlify/functions/projects"
  status = 200
  force = true

[[redirects]]
  from = "/api/projects/*"
  to = "/.netlify/functions/projects"
  status = 200
  force = true

[[redirects]]
  from = "/api/employees"
  to = "/.netlify/functions/create-employee"
  status = 200
  force = true

[[redirects]]
  from = "/api/evaluation-analysis"
  to = "/.netlify/functions/evaluation-analysis"
  status = 200
  force = true

[[redirects]]
  from = "/api/ceo-analysis"
  to = "/.netlify/functions/ceo-analysis"
  status = 200
  force = true

[[redirects]]
  from = "/api/ai-chat"
  to = "/.netlify/functions/ai-chat"
  status = 200
  force = true

[[redirects]]
  from = "/api/av-workload-insight"
  to = "/.netlify/functions/av-workload-insight"
  status = 200
  force = true

[[redirects]]
  from = "/api/employee-scores-snapshot"
  to = "/.netlify/functions/employee-scores-snapshot"
  status = 200
  force = true

[[redirects]]
  from = "/api/employees/manage"
  to = "/.netlify/functions/archive-employee"
  status = 200
  force = true

[[redirects]]
  from = "/api/employees/update"
  to = "/.netlify/functions/update-employee"
  status = 200
  force = true

[[redirects]]
  from = "/api/self-god-mode"
  to = "/.netlify/functions/self-god-mode"
  status = 200
  force = true

[[redirects]]
  from = "/mcp"
  to = "/.netlify/functions/mcp"
  status = 200
  force = true

[[redirects]]
  from = "/.well-known/oauth-protected-resource"
  to = "/.netlify/functions/oauth"
  status = 200
  force = true

[[redirects]]
  from = "/.well-known/oauth-protected-resource/mcp"
  to = "/.netlify/functions/oauth"
  status = 200
  force = true

[[redirects]]
  from = "/.well-known/oauth-authorization-server"
  to = "/.netlify/functions/oauth"
  status = 200
  force = true

[[redirects]]
  from = "/oauth/*"
  to = "/.netlify/functions/oauth"
  status = 200
  force = true

[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

[[headers]]
  for = "/index.html"
  [headers.values]
    Cache-Control = "no-cache, no-store, must-revalidate"

[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"
